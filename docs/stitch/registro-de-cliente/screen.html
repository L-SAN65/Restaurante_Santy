<!DOCTYPE html><html class="light" lang="en"><head>

                    "on-secondary-fixed-variant": "#574500",

            },
            "borderRadius": {

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(229, 225, 216, 0.5);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background min-h-screen relative overflow-hidden flex items-center justify-center p-4">
<!-- Blurred Background Image -->
<div class="absolute inset-0 z-0 pointer-events-none w-full h-full bg-cover bg-center" data-alt="A luxurious, high-end restaurant interior dining room. Soft, warm ambient lighting illuminating elegantly set tables with crisp white linens and fine glassware. The scene is slightly out of focus, creating a sophisticated bokeh effect. Colors are rich deep charcoals, warm golds, and creamy whites, establishing a premium, corporate modern hospitality aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBX-uN4ozn8isN4PcVdgW6YWTCONNsaaF_yW-SHyV_bKXfks7-c2hQOKG1iGYfY7NvMD4eNOobFt-SUrvXzVdC1_HFiiEpLO3e_p95ZUhPUrp3zliqtT5vR_QAjVpj3xiBGdpJN4uM9zlaUtj4eGi0Fov1uqh7T6PUJhiKm25tJ0MQCwN4K8z18CDdsz74sOBkHEzy5ljYXT2pJgHaalHppqdhvGxRDNv6-f3a6ZUJpqzfvJYp2RemJ')"></div>
<div class="absolute inset-0 z-0 bg-primary/20 backdrop-blur-sm pointer-events-none"></div>
<!-- Registration Container -->
<div class="glass-card w-full max-w-lg rounded-xl z-10 p-8 md:p-12 flex flex-col items-center">
<!-- Logo / Brand -->
<div class="mb-8 text-center w-full">
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter mb-2">LUXE DINING</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs mx-auto">Create an account to track loyalty points and access exclusive member benefits.</p>
</div>
<!-- Form -->
<form class="w-full space-y-5" onsubmit="event.preventDefault();">
<div class="space-y-4">
<!-- Full Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface" for="fullName">Full Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-0 rounded font-body-md text-body-md text-on-surface py-3 px-4 transition-colors" id="fullName" placeholder="Jane Doe" type="text">
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-0 rounded font-body-md text-body-md text-on-surface py-3 px-4 transition-colors" id="email" placeholder="jane.doe@example.com" type="email">
</div>
<!-- Phone -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface" for="phone">Phone Number</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-0 rounded font-body-md text-body-md text-on-surface py-3 px-4 transition-colors" id="phone" placeholder="+1 (555) 000-0000" type="tel">
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5 relative">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-0 rounded font-body-md text-body-md text-on-surface py-3 px-4 pr-10 transition-colors" id="password" placeholder="••••••••" type="password">
<button class="absolute right-3 top-[30px] text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-1.5 relative">
<label class="font-label-sm text-label-sm text-on-surface" for="confirmPassword">Confirm Password</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant focus:border-primary focus:ring-0 rounded font-body-md text-body-md text-on-surface py-3 px-4 pr-10 transition-colors" id="confirmPassword" placeholder="••••••••" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-secondary-container text-on-secondary-container font-label-md text-label-md py-4 rounded hover:opacity-90 hover:shadow-md transition-all duration-200 mt-6 flex justify-center items-center gap-2" type="submit">
                Create Account
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center w-full border-t border-outline-variant pt-6">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="font-label-sm text-label-sm text-primary hover:text-on-surface-variant transition-colors underline underline-offset-2" href="#">Log in</a>
</p>
</div>
</div>
</body></html>
