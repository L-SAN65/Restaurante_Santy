{% extends "base.html" %}
{% block title %}Ingreso · Santy{% endblock %}
{% block body %}
<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-primary to-primary-deep p-4">
  <div class="card w-full max-w-md p-8 shadow-modal">
    <div class="mb-6 flex flex-col items-center">
      <span class="flex h-14 w-14 items-center justify-center rounded-full bg-primary text-2xl font-bold text-white">S</span>
      <h1 class="mt-4 text-2xl font-semibold tracking-tight text-text-primary">Bienvenido</h1>
      <p class="text-sm text-text-secondary">Ingrese sus credenciales para continuar</p>
    </div>

    {% if messages %}
    <div class="mb-4 space-y-2">
      {% for message in messages %}
      <div class="rounded-component bg-red-50 px-4 py-3 text-sm font-medium text-danger">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="username" class="label">Email</label>
        <input type="email" id="username" name="username" class="input" placeholder="correo@restaurante.com" required autofocus>
      </div>
      <div>
        <label for="password" class="label">Contraseña</label>
        <div class="relative">
          <input type="password" id="password" name="password" class="input pr-10" placeholder="••••••••" required>
          <button type="button" onclick="togglePassword()" class="absolute right-2 top-1/2 -translate-y-1/2 text-text-secondary hover:text-text-primary" aria-label="Mostrar contraseña">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-primary w-full">Ingresar</button>
      <p class="text-center text-sm text-text-secondary">
        <a href="#" class="text-primary hover:underline">¿Olvidó su contraseña?</a>
      </p>
    </form>
  </div>
</div>
<script>
  function togglePassword() {
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
  }
</script>
{% endblock %}
