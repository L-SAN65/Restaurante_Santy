{% extends "base.html" %}
{% block title %}Segmentar Cuenta · Santy{% endblock %}
{% block content %}
<div class="mb-6 flex items-center justify-between">
  <h1 class="text-3xl font-semibold tracking-tight">Segmentar Cuenta</h1>
  <button class="btn-secondary" onclick="window.history.back()">Volver</button>
</div>

<form class="space-y-4" id="segment-form">
  <div>
    <label for="total-amount" class="label">Total de la cuenta</label>
    <input type="number" id="total-amount" name="total_amount" class="input" placeholder="0.00" step="0.01" required>
  </div>

  <div>
    <label for="client-cedule" class="label">Cédula del cliente</label>
    <input type="text" id="client-cedule" name="client_cedule" class="input" placeholder="Ej: V-12345678">
  </div>

  <div id="items-list" class="space-y-3">
    <!-- Items will be rendered by JavaScript -->
  </div>

  <button type="button" class="text-primary hover:underline text-sm" onclick="addItemRow()">Añadir ítem</button>

  <div class="mt-4 flex justify-between">
    <div>
      <p class="text-sm text-text-secondary">Subtotal</p>
      <p class="text-2xl font-semibold tabular-nums" id="subtotal">$0.00</p>
    </div>
    <div>
      <p class="text-sm text-text-secondary">IVA 15%</p>
      <p class="text-2xl font-semibold tabular-nums" id="iva">$0.00</p>
    </div>
    <div>
      <p class="text-sm text-text-secondary">Total por segmento</p>
      <p class="text-2xl font-bold text-primary tabular-nums" id="segment-total">$0.00</p>
    </div>
  </div>

  <button type="submit" class="btn-primary w-full mt-4">Generar Facturas Parciales</button>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
  let items = [];
  
  const addItemRow = () => {
    const container = document.getElementById('items-list');
    if (!container) return;
    
    const div = document.createElement('div');
    div.className = 'flex items-center gap-4 p-3 rounded-card border';
    div.innerHTML = `
      <input type="text" class="input flex-1 item-name" placeholder="Nombre del ítem">
      <input type="number" min="0" step="0.01" class="input w-32 item-price" placeholder="Precio">
      <select class="input w-24 item-segment" multiple>
        <option value="0">Ninguno</option>
        <option value="1">Grupo 1</option>
        <option value="2">Grupo 2</option>
        <option value="3">Grupo 3</option>
      </select>
      <button type="button" class="text-danger hover:underline remove-item">×</button>
    `;
    
    const removeBtn = div.querySelector('.remove-item');
    removeBtn.addEventListener('click', () => div.remove());
    
    container.appendChild(div);
  };
  
  // Initial item rows
  addItemRow();
  addItemRow();
  addItemRow();
  
  const calculateTotals = () => {
    let subtotal = 0;
    const segments = {};
    const priceInputs = document.querySelectorAll('.item-price');
    const segmentSelects = document.querySelectorAll('.item-segment');
    
    priceInputs.forEach((input, index) => {
      const value = parseFloat(input.value) || 0;
      subtotal += value;
      
      const segment = segmentSelects[index] ? segmentSelects[index].value : '0';
      if (!segments[segment]) {
        segments[segment] = 0;
      }
      segments[segment] += value;
    });
    
    const iva = subtotal * 0.15;
    const segmentTotals = {};
    for (const [seg, amount] of Object.entries(segments)) {
      segmentTotals[seg] = {
        subtotal: amount,
        iva: amount * 0.15,
        total: amount * 1.15
      };
    }
    
    document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
    document.getElementById('iva').textContent = `$${iva.toFixed(2)}`;
    
    // Show each segment total
    const segmentContainer = document.getElementById('segment-total');
    if (segmentContainer) {
      let total = 0;
      for (const [seg, calc] of Object.entries(segmentTotals)) {
        total += calc.total;
        // Could display per-segment info here
      }
      segmentContainer.textContent = `$${total.toFixed(2)}`;
    }
  };
  
  document.querySelectorAll('.item-price, .item-segment').forEach(input => {
    input.addEventListener('input', calculateTotals);
  });
});
</script>
{% endblock %}
