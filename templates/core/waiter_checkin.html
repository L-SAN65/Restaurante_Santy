{% extends "base.html" %}
{% block title %}Check-In · Santy{% endblock %}
{% block content %}
<div class="mb-6 flex items-center justify-between">
  <h1 class="text-3xl font-semibold tracking-tight">Check-In de Llegada</h1>
  <button class="btn-secondary" onclick="window.history.back()">Volver</button>
</div>

<form class="space-y-4" id="checkin-form">
  <div>
    <label for="cedula" class="label">Cédula del comensal</label>
    <input type="text" id="cedula" name="cedula" class="input" placeholder="V-12345678" required>
  </div>

  <div>
    <label for="reservation-id" class="label">ID de Reserva</label>
    <input type="text" id="reservation-id" name="reservation_id" class="input" placeholder="Número reserva">
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="label">Personas reales</label>
      <input type="number" id="real-people" name="real_people" class="input" min="1" required>
    </div>
    <div>
      <label class="label">Mesas en reserva</label>
      <input type="number" id reserved-tables" name="reserved_tables" class="input" min="0" required>
    </div>
  </div>

  <div>
    <label class="label">Observaciones</label>
    <textarea id="observations" name="observations" rows="3" class="input placeholder-text-sm"></textarea>
  </div>

  <div class="mt-4 flex justify-between">
    <div>
      <p class="text-sm text-text-personas-aforo">Aforo actual</p>
      <p class="text-2xl font-semibold tabular-nums" id="current-aforo">0</p>
    </div>
    <div>
      <p class="text-sm text-text-personas-aforo">Aforo máximo</p>
      <p class="text-2xl font-semibold tabular-nums" id="max-aforo">100</p>
    </div>
  </div>

  <button type="submit" class="btn-primary w-full mt-4">Validar Llegada</button>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const maxAforo = parseInt(document.getElementById('max-aforo')?.textContent || '0');
  
  const form = document.getElementById('checkin-form');
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const cedula = document.getElementById('cedula').value.trim();
      const realPeople = parseInt(document.getElementById('real-people').value) || 0;
      
      if (!cedula) {
        alert('Por favor ingrese la cédula');
        return;
      }
      
      try {
        const response = await fetch('/api/checkin/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCSRFToken()
          },
          body: JSON.stringify({
            cedula: cedula,
            real_people: realPeople
          })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          alert('Check-in exitoso:\n' +
            `Reserva: ${data.reservation_id}\n` +
            `Personas actualizadas: ${data.updated_people}\n` +
            `Mesas unidas: ${data.tables_joined}\n` +
            `Estado: ${data.table_status}`);
          window.location.href = '{% url "core:waiter_dashboard" %}';
        } else {
          alert('Error: ' + (data.detail || 'Error desconocido'));
        }
      } catch (error) {
        alert('Error de conexión: ' + error.message);
      }
    });
  }
  
  const getCSRFToken = () => {
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
      const parts = cookie.trim().split('=');
      if (parts[0] === 'csrftoken') {
        return parts[1];
      }
    }
    return '';
  };
});
</script>
{% endblock %}
