{% extends "base.html" %}
{% block title %}Nueva Comanda · Santy{% endblock %}
{% block content %}
<div class="mb-6 flex items-center justify-between">
  <h1 class="text-3xl font-semibold tracking-tight">Nueva Comanda</h1>
  <button class="btn-secondary" onclick="window.history.back()">Volver</button>
</div>

<form class="space-y-4" id="order-form">
  <div>
    <label for="table-select" class="label">Mesa</label>
    <select id="table-select" name="table" class="input">
      <option value="">Seleccionar mesa</option>
      {% for table in tables %}
      <option value="{{ table.id }}">{{ table.nombre }} ({{ table.capacity }} personas)</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label for="client-name" class="label">Nombre del cliente</label>
    <input type="text" id="client-name" name="client_name" class="input" placeholder="Nombre o cédula">
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="label">Productos</label>
      <div id="products-list" class="space-y-2" max-height: 300px; overflow-y: auto;">
        <!-- Products will be rendered by JavaScript -->
      </div>
      <button type="button" class="text-primary hover:underline text-sm mt-2" onclick="addProductRow()">Añadir producto</button>
    </div>
    <div>
      <label class="label">Observaciones</label>
      <textarea id="observations" name="observations" rows="3" class="input placeholder-text-sm"></textarea>
    </div>
  </div>

  <div class="mt-4 flex justify-between items-end">
    <div>
      <p class="text-sm text-text-secondary">Subtotal</p>
      <p class="text-2xl font-semibold tabular-nums" id="order-subtotal">$0.00</p>
    </div>
    <div>
      <p class="text-sm text-text-secondary">IVA 15%</p>
      <p class="text-2xl font-semibold tabular-nums" id="order-iva">$0.00</p>
    </div>
    <div>
      <p class="text-sm text-text-secondary">Total</p>
      <p class="text-2xl font-bold text-primary tabular-nums" id="order-total">$0.00</p>
    </div>
  </div>

  <button type="submit" class="btn-primary w-full mt-4">Enviar Comanda a KDS</button>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
  let products = [];
  
  const addProductRow = () => {
    const container = document.getElementById('products-list');
    if (!container) return;
    
    const div = document.createElement('div');
    div.className = 'flex items-center gap-4 p-3 rounded-card border';
    div.innerHTML = `
      <input type="text" class="input flex-1 product-name" placeholder="Nombre del producto">
      <input type="number" min="1" class="input w-24 product-qty" placeholder="Cantidad">
      <input type="number" step="0.01" min="0" class="input w-32 product-price" placeholder="Precio">
      <button type="button" class="text-danger hover:underline remove-product">×</button>
    `;
    
    const removeBtn = div.querySelector('.remove-product');
    removeBtn.addEventListener('click', () => div.remove());
    
    container.appendChild(div);
  };
  
  // Initial product rows
  addProductRow();
  addProductRow();
  
  const calculateTotals = () => {
    let subtotal = 0;
    const inputs = document.querySelectorAll('.product-price');
    
    inputs.forEach(input => {
      const value = parseFloat(input.value) || 0;
      subtotal += value;
    });
    
    const iva = subtotal * 0.15;
    const total = subtotal + iva;
    
    document.getElementById('order-subtotal').textContent = `$${subtotal.toFixed(2)}`;
    document.getElementById('order-iva').textContent = `$${iva.toFixed(2)}`;
    document.getElementById('order-total').textContent = `$${total.toFixed(2)}`;
  };
  
  document.querySelectorAll('.product-price').forEach(calculateTotals);
  
  document.querySelectorAll('.product-price, .product-qty').forEach(input => {
    input.addEventListener('input', calculateTotals);
  });
});
</script>
{% endblock %}
