{% extends "base.html" %}
{% block title %}Plano de Sala · Santy{% endblock %}
{% block content %}
<div class="mb-6 flex items-center justify-between">
  <h1 class="text-3xl font-semibold tracking-tight">Plano de Sala</h1>
  <div class="flex items-center gap-2">
    <button class="btn-secondary">Nueva Comanda</button>
    <button class="btn-secondary">Segmentar Cuenta</button>
  </div>
</div>

<div class="grid grid-cols-2 gap-2 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8" id="table-plan">
  <!-- Tables will be rendered by JavaScript -->
</div>

<div class="mt-6 p-4 rounded-card border" id="floor-plan-info">
  <p class="text-sm text-text-secondary">Seleccione mesas para ver detalles</p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const colors = {
    disponible: 'rgba(34, 197, 94, 0.2)',
    reservada: 'rgba(236, 72, 153, 0.2)',
    ocupada: 'rgba(59, 130, 246, 0.2)',
    bloqueada: 'rgba(239, 68, 68, 0.2)'
  };
  
  const labels = {
    disponible: 'Disponible',
    reservada: 'Reservada', 
    ocupada: 'Ocupada',
    bloqueada: 'Bloqueada'
  };
  
  const renderTables = () => {
    const container = document.getElementById('table-plan');
    if (!container) return;
    
    container.innerHTML = '';
    
    // Generate 24 tables as per design specifications
    for (let i = 1; i <= 24; i++) {
      const state = localStorage.getItem(`table_${i}`) || 'disponible';
      const color = colors[state] || colors.disponible;
      const label = labels[state] || labels.disponible;
      
      const div = document.createElement('div');
      div.className = `card p-3 cursor-pointer hover:shadow-lg transition-shadow ${state}`;
      div.title = `Mesa ${i} - ${label}`;
      div.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium">Mesa ${i}</span>
          <span class="text-xs rounded-full px-2 py-1 capitalize" style="background: ${color}; color: white;">${label}</span>
        </div>
      `;
      div.addEventListener('click', () => openTableDetail(i));
      container.appendChild(div);
    }
  };
  
  const openTableDetail = (tableId) => {
    const infoDiv = document.getElementById('floor-plan-info');
    if (infoDiv) {
      infoDiv.innerHTML = `<p class="text-sm text-text-secondary">Mesa ${tableId} - detalles pending</p>`;
    }
  };
  
  renderTables();
});
</script>
{% endblock %}
